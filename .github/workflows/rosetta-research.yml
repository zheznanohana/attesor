name: Rosetta mechanism research
on:
  workflow_dispatch:
  push:
    branches: [research/rosetta-stage1]
    paths: ['research/rosetta/**', '.github/workflows/rosetta-research.yml']
permissions:
  contents: read
concurrency:
  group: rosetta-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  survey:
    # Heavy decompilation is explicit; ordinary probe/document edits must not
    # repeat the entire Ghidra download/build/survey.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-survey]')
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Native / Rosetta probes and read-only inventory
        run: python3 research/rosetta/collect.py research-results
      - name: Pinned Ghidra headless survey (ephemeral only)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 2 -o ghidra.zip 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip'
          echo '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  ghidra.zip' | shasum -a 256 -c -
          unzip -q ghidra.zip
          # Official distributions omit Mac ARM native binaries. Build only the
          # matching decompiler from pinned official sources (no system install).
          git clone --depth 1 --filter=blob:none --sparse --branch Ghidra_12.2_build https://github.com/NationalSecurityAgency/ghidra.git ghidra-native-source
          git -C ghidra-native-source sparse-checkout set Ghidra/Features/Decompiler/src/decompile/cpp
          test "$(git -C ghidra-native-source rev-parse HEAD)" = 8ca9077040cc43cd790babcfccf19475622a3e9a
          make -C ghidra-native-source/Ghidra/Features/Decompiler/src/decompile/cpp -j2 ghidra_opt \
            ARCH_TYPE='-arch arm64' ADDITIONAL_FLAGS='-mmacosx-version-min=13.0 -w' CXX='clang++ -std=c++17' \
            > "$RUNNER_TEMP/native-build.log" 2>&1
          mkdir -p "$RUNNER_TEMP/ghidra_12.2_PUBLIC/Ghidra/Features/Decompiler/os/mac_arm_64"
          cp ghidra-native-source/Ghidra/Features/Decompiler/src/decompile/cpp/ghidra_opt \
            "$RUNNER_TEMP/ghidra_12.2_PUBLIC/Ghidra/Features/Decompiler/os/mac_arm_64/decompile"
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          mkdir -p "$RUNNER_TEMP/ghidra-projects"
          target=/usr/libexec/rosetta/runtime
          "$RUNNER_TEMP/ghidra_12.2_PUBLIC/support/analyzeHeadless" "$RUNNER_TEMP/ghidra-projects" RosettaRuntime \
            -import "$target" -analysisTimeoutPerFile 240 -max-cpu 2 \
            -scriptPath "$GITHUB_WORKSPACE/research/rosetta" \
            -postScript Survey.java "$GITHUB_WORKSPACE/research-results/runtime-survey.txt" \
            > "$RUNNER_TEMP/ghidra-headless.log" 2>&1
          test -s "$GITHUB_WORKSPACE/research-results/runtime-survey.txt"
          grep -q 'decompiled=true' "$GITHUB_WORKSPACE/research-results/runtime-survey.txt"
          grep -E 'ERROR|WARN|REPORT:|Survey.java' "$RUNNER_TEMP/ghidra-headless.log" | tail -30 > "$GITHUB_WORKSPACE/research-results/ghidra-status.txt" || true
          target=/Library/Apple/usr/libexec/oah/libRosettaRuntime
          if test -r "$target"; then
            "$RUNNER_TEMP/ghidra_12.2_PUBLIC/support/analyzeHeadless" "$RUNNER_TEMP/ghidra-projects" RosettaLibrary \
              -import "$target" -analysisTimeoutPerFile 240 -max-cpu 2 \
              -scriptPath "$GITHUB_WORKSPACE/research/rosetta" \
              -postScript Survey.java "$GITHUB_WORKSPACE/research-results/library-survey.txt" \
              > "$RUNNER_TEMP/ghidra-library.log" 2>&1
            grep -q 'decompiled=true' "$GITHUB_WORKSPACE/research-results/library-survey.txt"
            grep -E 'ERROR|WARN|REPORT:|Survey.java' "$RUNNER_TEMP/ghidra-library.log" | tail -30 > "$GITHUB_WORKSPACE/research-results/ghidra-library-status.txt" || true
          fi
      - name: Upload small text evidence only (one day retention)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosetta-research-text
          path: research-results/
          retention-days: 1
          if-no-files-found: error
